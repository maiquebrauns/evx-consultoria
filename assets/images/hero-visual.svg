<svg viewBox="0 0 600 680" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradientes Sofisticados -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#090E17"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>

    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.02"/>
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>
    </linearGradient>

    <filter id="blurFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>

    <pattern id="isometricGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 40 M 0 0 L 40 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Fundo com grid sutil -->
  <rect width="600" height="680" rx="28" fill="url(#bgGrad)"/>
  <rect width="600" height="680" rx="28" fill="url(#isometricGrid)"/>

  <!-- Esfera de Glow Dinâmico -->
  <circle cx="450" cy="180" r="160" fill="url(#glowGrad)" filter="url(#blurFilter)"/>
  <circle cx="150" cy="520" r="120" fill="url(#glowGrad)" opacity="0.4" filter="url(#blurFilter)"/>

  <!-- Linhas Isométricas de Dados e Crescimento -->
  <g opacity="0.85">
    <!-- Grade de perspectiva -->
    <path d="M 60 480 L 300 620 L 540 480 L 300 340 Z" fill="rgba(37, 99, 235, 0.04)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5"/>
    <path d="M 120 445 L 300 550 L 480 445 L 300 340 Z" fill="none" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1"/>
    
    <!-- Painéis Translúcidos (Glassmorphism 3D) -->
    <!-- Painel 1: Base -->
    <polygon points="180,420 300,490 420,420 300,350" fill="url(#glassGrad)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1.5"/>
    
    <!-- Colunas de Crescimento (Indicadores) -->
    <!-- Coluna 1 -->
    <path d="M 210 400 L 235 415 L 235 340 L 210 325 Z" fill="#1E293B" stroke="rgba(255, 255, 255, 0.1)"/>
    <path d="M 235 415 L 260 400 L 260 325 L 235 340 Z" fill="#0F172A" stroke="rgba(255, 255, 255, 0.1)"/>
    <polygon points="210,325 235,340 260,325 235,310" fill="#334155"/>

    <!-- Coluna 2 -->
    <path d="M 275 365 L 300 380 L 300 270 L 275 255 Z" fill="#1E293B" stroke="rgba(255, 255, 255, 0.1)"/>
    <path d="M 300 380 L 325 365 L 325 255 L 300 270 Z" fill="#0F172A" stroke="rgba(255, 255, 255, 0.1)"/>
    <polygon points="275,255 300,270 325,255 300,240" fill="#334155"/>

    <!-- Coluna 3: Destaque Máximo (Accent Blue) -->
    <path d="M 340 330 L 365 345 L 365 190 L 340 175 Z" fill="#1D4ED8" stroke="rgba(255, 255, 255, 0.2)"/>
    <path d="M 365 345 L 390 330 L 390 175 L 365 190 Z" fill="#2563EB" stroke="rgba(255, 255, 255, 0.2)"/>
    <polygon points="340,175 365,190 390,175 365,160" fill="#38BDF8"/>

    <!-- Vetor Diagonal Superior Inspirado no Logo EVX -->
    <path d="M 140 450 Q 260 380 340 240 T 470 120" fill="none" stroke="url(#accentGrad)" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Ponta da Flecha EVX -->
    <polygon points="460,95 485,120 445,130" fill="#38BDF8"/>

    <!-- Pulso Luminoso no Nó de Liderança -->
    <circle cx="470" cy="120" r="14" fill="#38BDF8" fill-opacity="0.3"/>
    <circle cx="470" cy="120" r="6" fill="#FFFFFF"/>

    <!-- Nós de Dados Interconectados -->
    <circle cx="235" cy="310" r="4" fill="#38BDF8"/>
    <circle cx="300" cy="240" r="4" fill="#38BDF8"/>
    <line x1="235" y1="310" x2="300" y2="240" stroke="rgba(56, 189, 248, 0.4)" stroke-width="2" stroke-dasharray="4 4"/>
    <line x1="300" y1="240" x2="365" y2="160" stroke="rgba(56, 189, 248, 0.6)" stroke-width="2" stroke-dasharray="4 4"/>
    
    <!-- Cartão Flutuante Holográfico Interno -->
    <rect x="80" y="100" width="220" height="85" rx="14" fill="rgba(16, 22, 35, 0.75)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.2"/>
    <circle cx="112" cy="132" r="16" fill="rgba(37, 99, 235, 0.2)"/>
    <path d="M 106 132 L 111 137 L 119 127" fill="none" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
    <text x="140" y="130" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600">ÍNDICE DE ESCALA</text>
    <text x="140" y="152" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="800">Alta Eficiência</text>
  </g>
</svg>
